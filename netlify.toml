# Applies the shared site shell (nav, footer, CSS, JS) to every page on each deploy.
# See tools/shell.js and _shell/.
[build]
  command = "node tools/shell.js"
  publish = "."

# Old "5 Ways" sign-up page now points to the hosted guide.
[[redirects]]
  from = "/get-the-guide"
  to = "/guide"
  status = 301
  force = true

[[redirects]]
  from = "/cloud"
  to = "/public-cloud"
  status = 301
  force = true

[[redirects]]
  from = "/microsoft-solutions"
  to = "/microsoft-365"
  status = 301
  force = true

# Superseded draft that still carries old pricing. Send it to the live page.
[[redirects]]
  from = "/old-services-with-pricing"
  to = "/services"
  status = 301
  force = true

# Working drafts and design scratch pages. They are noindex and out of the
# sitemap, but they were still reachable by URL, so stop serving them.
[[redirects]]
  from = "/old-homepage-reference"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/index_backup_v20260609"
  to = "/404.html"
  status = 404
  force = true

